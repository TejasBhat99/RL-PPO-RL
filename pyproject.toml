[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlrl-env"
version = "0.1.0"
description = "A Gymnasium and PyTorch sandbox for Rocket League-inspired aerial navigation"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["reinforcement-learning", "gymnasium", "pytorch", "ppo", "dagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
]
train = [
    "torch>=2.3,<3",
    "tensorboard>=2.20,<3",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
